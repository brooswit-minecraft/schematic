name: Reusable Release

# Callable from a consumer's thin release.yml stub. Builds the .mrpack,
# attaches it to a GitHub Release, and publishes to Modrinth when configured.
# A pack-changing push to main creates the release from pack.toml, and the
# legacy release event remains supported; workflow_dispatch remains a dry
# run by default. Two optional inputs extend this for an automated caller
# that can't push or open a GitHub Release itself: `publish` (default false)
# opts a call into the same publish behaviour as a push, and `ref` (default
# '') checks out and releases a specific commit instead of the caller's own
# triggering ref. See the `on.workflow_call.inputs` block below for exact
# semantics, and the comment above the "Compute publish decision" step for
# the two gating predicates (P1/P2) everything downstream keys on.
# actions/checkout below checks out whichever repo invoked this workflow,
# not this one — unless `ref` is set, in which case it checks out that ref
# instead of the caller's own triggering ref.
#
# `github.event_name` / `github.event.release.*` here reflect the CALLER's
# original triggering event, not a synthetic "workflow_call" event — verified
# with a debug probe (github.event_name and github.event.inputs matched the
# stub's own workflow_dispatch payload exactly when read from inside a called
# workflow). We rely on that for the `release: published` path too.

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Pack version to build, forwarded from the stub's workflow_dispatch
          input (e.g. 0.1.0). Ignored when the caller was triggered by a
          published release — this workflow reads github.event.release.tag_name
          directly for that case.
        required: false
        type: string
      ref:
        description: >-
          Ref to check out and build from, e.g. a commit SHA an automated
          caller just pushed. When set, actions/checkout below checks out
          this ref instead of the caller's own triggering ref, and the
          GitHub release's target_commitish is the resolved SHA of that
          checkout rather than github.sha. Leave empty (the default) for
          behaviour that is byte-for-byte what it is today.
        required: false
        type: string
      publish:
        description: >-
          When true, this run publishes exactly like a push-triggered run:
          the refuse-to-overwrite guard runs before the build, the GitHub
          release is created with generated release notes, and the Modrinth
          publish runs (if configured). Meant for an automated caller (e.g.
          repository_dispatch) that can't otherwise reach the release/push
          paths. Leave false (the default) for behaviour that is
          byte-for-byte what it is today.
        required: false
        type: boolean
        default: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # actions/checkout treats an empty `ref:` (the default above) as "not
      # set" and falls back to the caller's own triggering ref/SHA, so this
      # step's output differs from github.sha only when `inputs.ref` was
      # actually given. checkout@v4 doesn't output the resolved SHA itself,
      # so we record it ourselves. Cheap, local, no secrets — runs
      # unconditionally rather than only when `inputs.ref` is set, since a
      # conditional here would buy nothing and only add a branch to read.
      - name: Resolve checkout SHA
        id: checkout_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The two predicates everything below keys on (SCHEM-28/SCHEM-30):
      #
      #   P1 = release || push || inputs.publish
      #     The observable "should this run publish at all?" decision.
      #     Gates the release-attach step and the Modrinth-publish step
      #     (the latter ANDed with has_modrinth, as today). Written to
      #     $GITHUB_OUTPUT and echoed to $GITHUB_STEP_SUMMARY so a typo'd
      #     condition is visible even when Modrinth is unconfigured and the
      #     Modrinth step would skip either way.
      #
      #   P2 = push || inputs.publish
      #     Gates the refuse-to-overwrite guard and generate_release_notes.
      #     Deliberately excludes `release`: on a release event the release
      #     already exists (that's what triggered the run), so keying the
      #     guard on P1 would fail every legacy release-path run — the
      #     guard would `exit 1` before the build even starts. Generated
      #     notes stay off on `release` for the same reason: the notes
      #     there are the human-authored release body, and switching to
      #     generated notes there would be a behaviour change, not a fix.
      #
      # Both inputs reach the shell only via env:, per this file's existing
      # convention (see "Resolve version" below) — never interpolated
      # directly into the run: body.
      - name: Compute publish decision
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$EVENT_NAME" = release ] || [ "$EVENT_NAME" = push ] || [ "$INPUT_PUBLISH" = true ]; then
            p1=true
          else
            p1=false
          fi
          if [ "$EVENT_NAME" = push ] || [ "$INPUT_PUBLISH" = true ]; then
            p2=true
          else
            p2=false
          fi
          echo "publish=$p1" >> "$GITHUB_OUTPUT"
          echo "guard=$p2" >> "$GITHUB_OUTPUT"
          {
            echo "P1 (release-attach / Modrinth-publish gate) = $p1"
            echo "P2 (overwrite-guard / generate_release_notes gate) = $p2"
          } >> "$GITHUB_STEP_SUMMARY"

      # Values reach the shell only through env: (data), never interpolated
      # directly into the script (code) — a tag/input containing quotes or
      # `$(...)` must not be able to execute in a job with contents: write.
      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = release ]; then
            raw="$RELEASE_TAG"
          elif [ -n "$INPUT_VERSION" ]; then
            raw="$INPUT_VERSION"
          else
            raw="$(sed -n 's/^version = "\(.*\)"/\1/p' pack.toml)"
          fi
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::pack version must be semver-like, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing automatic release
        if: steps.decision.outputs.guard == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release v$VERSION already exists. Bump pack.toml before merging another pack change."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # Kept in sync with PACKWIZ_REF in the Makefile, same as ci.yml.
      - name: Install pinned packwiz
        run: make tools

      # We rewrite pack.toml's version below to build under the release's tag,
      # which `make check` (compares pack.toml/index.toml/mods against git)
      # would flag as a stale index. That check already runs on every push and
      # PR via ci.yml, so it's skipped here rather than run before the rewrite.
      - name: Set pack version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Escape sed's replacement metacharacters (& and \) so a version
          # containing them can't corrupt pack.toml or execute as sed syntax.
          escaped=$(printf '%s' "$VERSION" | sed 's/[&\|]/\\&/g')
          sed -i "s|^version = \".*\"|version = \"${escaped}\"|" pack.toml

      - name: Build .mrpack
        run: make build

      # No pack name is hardcoded here — every consumer repo has its own
      # pack.toml `name`.
      - name: Resolve artifact name
        id: pack
        run: echo "name=$(sed -n 's/^name = "\(.*\)"/\1/p' pack.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}-${{ steps.ver.outputs.version }}-mrpack
          path: build/*.mrpack
          if-no-files-found: error

      - name: Attach .mrpack to the GitHub Release
        if: steps.decision.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ${{ steps.pack.outputs.name }} v${{ steps.ver.outputs.version }}
          # Unchanged (github.sha) on the default path — only an explicit
          # `ref` input routes this through the resolved-checkout SHA above.
          target_commitish: ${{ inputs.ref != '' && steps.checkout_sha.outputs.sha || github.sha }}
          generate_release_notes: ${{ steps.decision.outputs.guard }}
          files: build/*.mrpack

      # Secrets can't be referenced directly in `if:`, so map them into env
      # here and test only for emptiness — never print a secret's value.
      - name: Check Modrinth configuration
        id: modrinth_check
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          if [ -n "$MODRINTH_TOKEN" ] && [ -n "$MODRINTH_PROJECT_ID" ]; then
            echo "has_modrinth=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_modrinth=false" >> "$GITHUB_OUTPUT"
            missing=""
            [ -z "$MODRINTH_TOKEN" ] && missing="${missing}MODRINTH_TOKEN "
            [ -z "$MODRINTH_PROJECT_ID" ] && missing="${missing}MODRINTH_PROJECT_ID "
            echo "MODRINTH_TOKEN/MODRINTH_PROJECT_ID not set — skipping Modrinth publish (missing: ${missing})"
          fi

      # No Minecraft version or loader is hardcoded here — both come from the
      # consumer's own pack.toml [versions] table. `loaders` is whichever of
      # forge/fabric/neoforge/quilt keys are present, written one per line so
      # the publish steps below can turn them into repeated `--loader` flags
      # (rinth takes `--loader fabric --loader forge`, not a comma list — a
      # comma-joined string would register a single bogus loader literally
      # named "fabric,forge"). This step is pure local computation (two sed
      # reads into $GITHUB_OUTPUT, no network call, no secret), so it runs
      # whenever Modrinth is configured, on both the release path and the
      # workflow_dispatch path — the dispatch path's dry-run invocation below
      # needs real values to print. Only the actual publish step stays gated
      # to P1.
      - name: Resolve Modrinth targets
        if: steps.modrinth_check.outputs.has_modrinth == 'true'
        id: targets
        run: |
          echo "minecraft=$(sed -n 's/^minecraft = "\(.*\)"/\1/p' pack.toml)" >> "$GITHUB_OUTPUT"
          {
            echo "loaders<<TARGETS_EOF"
            sed -n -E 's/^(forge|fabric|neoforge|quilt) = ".*"/\1/p' pack.toml
            echo "TARGETS_EOF"
          } >> "$GITHUB_OUTPUT"

      # rinth takes exactly one --file path and does existsSync on it
      # literally — a glob string like build/*.mrpack will not expand and
      # fails as a missing file. Resolve it to one concrete path ourselves,
      # and fail loudly (rather than silently picking one) if the build
      # produced zero or more than one .mrpack.
      - name: Resolve .mrpack path
        if: steps.modrinth_check.outputs.has_modrinth == 'true'
        id: mrpack
        run: |
          shopt -s nullglob
          mrpacks=(build/*.mrpack)
          if [ "${#mrpacks[@]}" -eq 0 ]; then
            echo "::error::No .mrpack file found in build/ (expected exactly one) — did the build step run?"
            exit 1
          elif [ "${#mrpacks[@]}" -gt 1 ]; then
            echo "::error::Multiple .mrpack files found in build/, expected exactly one: ${mrpacks[*]}"
            exit 1
          fi
          echo "file=${mrpacks[0]}" >> "$GITHUB_OUTPUT"

      # The changelog is github.event.release.body, which anyone who can cut
      # a release controls. Written to a file from env: rather than
      # interpolated into a run: body, per the convention above (lines
      # 36-38) — GitHub substitutes a value into run: textually before the
      # shell runs it, so a body containing $(...) or a quote must not reach
      # the shell of a job with contents: write. This also gets multi-line
      # bodies (the normal case) to rinth cleanly via --changelog-file. Only
      # a `release` event has a human-authored body; a `publish: true` run
      # that isn't itself a release event gets an empty changelog file here.
      - name: Write Modrinth changelog to file
        if: steps.modrinth_check.outputs.has_modrinth == 'true'
        id: changelog
        env:
          RELEASE_BODY: ${{ github.event_name == 'release' && github.event.release.body || '' }}
        run: |
          file="$RUNNER_TEMP/modrinth-changelog.txt"
          printf '%s' "$RELEASE_BODY" > "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.modrinth_check.outputs.has_modrinth == 'true'

      # Turns the workflow_dispatch dry run from a bare assertion into a real
      # check of the payload that would be sent: rinth's own --dry-run reads
      # the resolved .mrpack file and prints the project, file, version,
      # channel, game version(s) and loaders it would upload as JSON, before
      # any project/version lookup or upload is attempted — it never touches
      # ctx.transport, so this cannot make a network call (verified against
      # rinth's source at v0.8.0). This is a SECOND belt, not a replacement
      # for the `if:` on the "Publish to Modrinth" step below — that `if:`,
      # keyed on P1, is what actually prevents a dispatch run from ever
      # publishing. Two separate steps with mutually exclusive `if:`
      # conditions, deliberately not one step whose --dry-run flag is
      # computed from an expression — collapsing them would make a string
      # interpolation the only thing standing between a dispatch run and a
      # live publish. Requiring P1 == 'false' here (rather than just
      # `github.event_name == 'workflow_dispatch'`) is what keeps this step
      # and the publish step below mutually exclusive now that a
      # workflow_dispatch caller can also set `publish: true`: without it,
      # a workflow_dispatch run with publish: true would run both this dry
      # run AND the real publish in the same job.
      - name: Dry-run Modrinth publish
        if: steps.modrinth_check.outputs.has_modrinth == 'true' && github.event_name == 'workflow_dispatch' && steps.decision.outputs.publish == 'false'
        env:
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MRPACK_FILE: ${{ steps.mrpack.outputs.file }}
          VERSION: ${{ steps.ver.outputs.version }}
          CHANGELOG_FILE: ${{ steps.changelog.outputs.file }}
          MINECRAFT: ${{ steps.targets.outputs.minecraft }}
          LOADERS: ${{ steps.targets.outputs.loaders }}
          CHANNEL: ${{ contains(steps.ver.outputs.version, '-') && 'beta' || 'release' }}
        run: |
          loader_flags=()
          while IFS= read -r loader; do
            [ -n "$loader" ] && loader_flags+=(--loader "$loader")
          done <<< "$LOADERS"

          bunx --bun github:brooswit-minecraft/rinth#v0.8.0 publish "$PROJECT_ID" \
            --file "$MRPACK_FILE" \
            --version "$VERSION" \
            --changelog-file "$CHANGELOG_FILE" \
            --game-version "$MINECRAFT" \
            "${loader_flags[@]}" \
            --channel "$CHANNEL" \
            --dry-run

      # The only step that actually writes to Modrinth. --name is omitted so
      # it defaults to $VERSION (rinth: `name ?? version`), matching what
      # this workflow passed explicitly before. rinth itself refuses to
      # publish a duplicate version_number (exits 5) before any upload — a
      # behaviour change from before, called out in the PR description.
      - name: Publish to Modrinth
        if: steps.modrinth_check.outputs.has_modrinth == 'true' && steps.decision.outputs.publish == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MRPACK_FILE: ${{ steps.mrpack.outputs.file }}
          VERSION: ${{ steps.ver.outputs.version }}
          CHANGELOG_FILE: ${{ steps.changelog.outputs.file }}
          MINECRAFT: ${{ steps.targets.outputs.minecraft }}
          LOADERS: ${{ steps.targets.outputs.loaders }}
          CHANNEL: ${{ contains(steps.ver.outputs.version, '-') && 'beta' || 'release' }}
        run: |
          loader_flags=()
          while IFS= read -r loader; do
            [ -n "$loader" ] && loader_flags+=(--loader "$loader")
          done <<< "$LOADERS"

          bunx --bun github:brooswit-minecraft/rinth#v0.8.0 publish "$PROJECT_ID" \
            --file "$MRPACK_FILE" \
            --version "$VERSION" \
            --changelog-file "$CHANGELOG_FILE" \
            --game-version "$MINECRAFT" \
            "${loader_flags[@]}" \
            --channel "$CHANNEL"

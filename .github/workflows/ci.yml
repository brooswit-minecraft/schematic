name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    uses: brooswit-minecraft/schematic/.github/workflows/reusable-ci.yml@v1
    secrets: inherit

  tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The loopback backup tests use the real Paramiko SFTP protocol and
      # must never silently disappear from CI as a skipped optional module.
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check paramiko==4.0.0

      - name: Run all Python tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"

          # Keep the complete unittest summary (including its count) visible
          # in the job log, and make a skipped loopback module an explicit CI
          # failure rather than a green-but-incomplete run.
          if ! grep -Eq '^Ran [0-9]+ tests' "$RUNNER_TEMP/unittest.log"; then
            echo '::error::unittest did not report its test count'
            exit 1
          fi
          if grep -Eq 'test_server_backup_loopback.*skipped' "$RUNNER_TEMP/unittest.log"; then
            echo '::error::test_server_backup_loopback was skipped; CI requires the real-protocol suite'
            exit 1
          fi

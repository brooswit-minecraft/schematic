name: Reusable Accepted-Merge Release

# MINECRAFT-371 implementing MINECRAFT-44: a schematic-owned, idempotent
# release-orchestration contract for consumers (e.g. brooswit-minecraft/sickos)
# whose own release-policy workflow has already decided a merge is
# accepted-for-release and computed the version/authorization/hold inputs.
# This workflow owns only the shared MECHANISM — checkout of an immutable
# SHA, GitHub Release reconcile, the RINTH/Modrinth publication boundary,
# and the machine-readable state contract. Consumer repos keep their own
# eligibility/version/hold POLICY and pass the results in as inputs.
#
# See docs/accepted-merge-release-contract.md for the full contract
# (inputs, outputs, the six states, and the retry/overlap guarantees).
#
# Decision logic lives in scripts/release_state.py (unit tested in
# tests/test_release_state.py) so it is testable without a runner. A
# calling repo's own checkout (at `sha`) is NOT assumed to contain this
# script — every job below checks out this helper separately from
# brooswit-minecraft/schematic itself, pinned to `schematic-ref`, into
# `.schematic-mechanism/`, so a consumer repo needs nothing copied in to
# use this workflow.

on:
  workflow_call:
    inputs:
      sha:
        description: >-
          Immutable source commit SHA to build and (if authorized) release —
          exactly 40 lowercase hex characters. This workflow always checks
          out this exact SHA, never the caller's own triggering ref.
        required: true
        type: string
      version:
        description: >-
          Pack version to release, e.g. 1.2.3 or 1.2.3-beta.1 (a leading
          "v" is accepted and stripped). Validated as semver-like; an
          invalid value fails the run before anything is built. Canonicalized
          (leading "v" stripped) before it is used anywhere, including the
          concurrency lock, so `1.2.3` and `v1.2.3` are the same release.
        required: true
        type: string
      authorized:
        description: >-
          Whether the caller's own policy has accepted this merge for
          release. false produces state=build-only: the pack is built and
          uploaded as a workflow artifact, nothing is released or published.
        required: true
        type: boolean
      hold:
        description: >-
          Explicit release hold. When true (and authorized is true),
          produces state=held — same build-only behaviour as authorized:
          false, but distinguishes "paused despite being eligible" from
          "not eligible" for anyone reading the state output.
        required: false
        type: boolean
        default: false
      modrinth-required:
        description: >-
          When true (the default) and MODRINTH_TOKEN/MODRINTH_PROJECT_ID
          are not configured, the run FAILS actionably rather than silently
          publishing only the GitHub Release. Set false for a consumer that
          intentionally releases to GitHub only.
        required: false
        type: boolean
        default: true
      notes-file:
        description: >-
          Repo-relative path to a file, read at the checked-out sha, whose
          contents become the GitHub release body and the Modrinth
          changelog. Leave empty for an auto-generated GitHub release body
          and an empty Modrinth changelog.
        required: false
        type: string
        default: ''
      rinth-ref:
        description: 'Pinned brooswit-minecraft/rinth tag to invoke via bunx.'
        required: false
        type: string
        default: 'v0.9.1'
      schematic-ref:
        description: >-
          REQUIRED, no default: the exact brooswit-minecraft/schematic
          commit SHA (or tag, once one exists that contains
          scripts/release_state.py) this workflow checks its own mechanism
          helper out from. There is deliberately no default here — `v1`
          predates this helper and does not contain it (checking that out
          would fail fast with an actionable error, not silently misbehave,
          but an input you have to look up anyway should not masquerade as
          optional). See docs/accepted-merge-release-contract.md for a
          concrete, currently-valid example SHA, and re-pin to the next cut
          of `v1` once one exists.
        required: true
        type: string
    outputs:
      state:
        description: 'One of: build-only, held, skipped, publishing, published, failed.'
        value: ${{ jobs.outcome.outputs.state }}
      sha:
        description: 'The exact source SHA this run built from (echoes the input).'
        value: ${{ jobs.outcome.outputs.sha }}
      version:
        description: 'The validated, normalized version (no leading v).'
        value: ${{ jobs.outcome.outputs.version }}
      artifact-name:
        description: 'Name of the uploaded .mrpack workflow artifact.'
        value: ${{ jobs.outcome.outputs.artifact-name }}
      release-id:
        description: 'GitHub Release id, when a release exists for this run (reused or created).'
        value: ${{ jobs.outcome.outputs.release-id }}
      release-url:
        description: 'GitHub Release URL, when a release exists for this run.'
        value: ${{ jobs.outcome.outputs.release-url }}
      modrinth-version-id:
        description: 'Modrinth version id, when a Modrinth version exists for this run (reused or created).'
        value: ${{ jobs.outcome.outputs.modrinth-version-id }}

jobs:
  # Validates inputs and resolves the canonical (no leading "v") version
  # BEFORE the release job's concurrency group is evaluated. A job's
  # `concurrency:` key can reference `needs.*.outputs`, which is what lets
  # the lock below key on the canonical version rather than the raw input —
  # `1.2.3` and `v1.2.3` must serialize against each other, not get
  # independent locks for what is the same release.
  normalize:
    name: Validate inputs
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      version: ${{ steps.validate.outputs.version }}
      schematic-sha: ${{ steps.resolve_schematic_sha.outputs.sha }}
    steps:
      - name: Check out schematic mechanism helper
        uses: actions/checkout@v4
        with:
          repository: brooswit-minecraft/schematic
          ref: ${{ inputs.schematic-ref }}
          path: .schematic-mechanism

      # Resolved ONCE, here, and threaded through to the `release` job as
      # an exact commit SHA (`schematic-sha` output) rather than having
      # that job independently re-resolve `schematic-ref` itself. If
      # `schematic-ref` names a tag or branch, two independent resolutions
      # of the same input could in principle land on different commits if
      # the ref moved between them (a TOCTOU window — however narrow); both
      # jobs now use the one commit pinned here instead.
      - name: Resolve schematic-ref to an exact commit SHA
        id: resolve_schematic_sha
        working-directory: .schematic-mechanism
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Confirm the mechanism helper exists at schematic-ref
        env:
          SCHEMATIC_REF: ${{ inputs.schematic-ref }}
        run: |
          if [ ! -f .schematic-mechanism/scripts/release_state.py ]; then
            echo "::error::schematic-ref '$SCHEMATIC_REF' does not contain scripts/release_state.py — pin schematic-ref to a brooswit-minecraft/schematic commit SHA (or, once one exists, a tag) that includes this file. See docs/accepted-merge-release-contract.md for a concrete example."
            exit 1
          fi

      - name: Validate sha and version
        id: validate
        env:
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          out="$(python3 .schematic-mechanism/scripts/release_state.py validate --sha "$SHA" --version "$VERSION")" || {
            echo "::error::$(echo "$out" | jq -r .error)"
            exit 1
          }
          echo "sha=$(echo "$out" | jq -r .sha)" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$out" | jq -r .version)" >> "$GITHUB_OUTPUT"

  release:
    name: Reconcile accepted-merge release
    needs: normalize
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # Serializes per repo+CANONICAL version so a retry or an overlapping
      # event for the same release can never race another run of the same
      # release (DoD #2), and so `1.2.3`/`v1.2.3` callers share one lock.
      # cancel-in-progress is deliberately false: the second run must
      # reconcile against what the first one did, not erase its progress.
      group: accepted-merge-release-${{ github.repository }}-${{ needs.normalize.outputs.version }}
      cancel-in-progress: false
    outputs:
      state: ${{ steps.finalize.outputs.state || steps.checkpoint.outputs.state || steps.shortcircuit.outputs.state || 'failed' }}
      sha: ${{ needs.normalize.outputs.sha }}
      version: ${{ needs.normalize.outputs.version }}
      artifact-name: ${{ steps.pack.outputs.name }}
      release-id: ${{ steps.finalize.outputs.release-id || steps.checkpoint.outputs.release-id || steps.shortcircuit.outputs.release-id }}
      release-url: ${{ steps.finalize.outputs.release-url || steps.checkpoint.outputs.release-url || steps.shortcircuit.outputs.release-url }}
      modrinth-version-id: ${{ steps.finalize.outputs.modrinth-version-id || steps.checkpoint.outputs.modrinth-version-id || steps.shortcircuit.outputs.modrinth-version-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.normalize.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Confirm checkout resolved to the exact requested SHA
        env:
          SHA: ${{ needs.normalize.outputs.sha }}
        run: |
          resolved="$(git rev-parse HEAD)"
          if [ "$resolved" != "$SHA" ]; then
            echo "::error::checked out HEAD ($resolved) does not match the requested sha ($SHA) — refusing to proceed on an ambiguous ref"
            exit 1
          fi

      # Pinned to `needs.normalize.outputs.schematic-sha` — the exact commit
      # `normalize` already resolved `schematic-ref` to — rather than
      # re-resolving `inputs.schematic-ref` independently here, so both jobs
      # are guaranteed to execute the identical mechanism revision even if
      # `schematic-ref` names a moving tag/branch.
      - name: Check out schematic mechanism helper
        uses: actions/checkout@v4
        with:
          repository: brooswit-minecraft/schematic
          ref: ${{ needs.normalize.outputs.schematic-sha }}
          path: .schematic-mechanism

      # Defense in depth only: `normalize` already checked this against the
      # same resolved commit (schematic-sha), so this should be unreachable
      # — but this job doesn't otherwise re-verify anything about that
      # checkout, and the check is cheap.
      - name: Confirm the mechanism helper exists at the resolved schematic commit
        env:
          SCHEMATIC_SHA: ${{ needs.normalize.outputs.schematic-sha }}
        run: |
          if [ ! -f .schematic-mechanism/scripts/release_state.py ]; then
            echo "::error::resolved schematic commit '$SCHEMATIC_SHA' does not contain scripts/release_state.py — pin schematic-ref to a brooswit-minecraft/schematic commit SHA (or, once one exists, a tag) that includes this file. See docs/accepted-merge-release-contract.md for a concrete example."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install pinned packwiz
        run: make tools

      - name: Set pack version
        env:
          VERSION: ${{ needs.normalize.outputs.version }}
        run: |
          escaped=$(printf '%s' "$VERSION" | sed 's/[&\|]/\\&/g')
          sed -i "s|^version = \".*\"|version = \"${escaped}\"|" pack.toml

      - name: Build .mrpack
        run: make build

      - name: Resolve artifact name
        id: pack
        env:
          VERSION: ${{ needs.normalize.outputs.version }}
        run: echo "name=$(sed -n 's/^name = "\(.*\)"/\1/p' pack.toml)-${VERSION}-mrpack" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: build/*.mrpack
          if-no-files-found: error

      - name: Resolve .mrpack path
        id: mrpack
        run: |
          shopt -s nullglob
          mrpacks=(build/*.mrpack)
          if [ "${#mrpacks[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .mrpack in build/, found ${#mrpacks[@]}"
            exit 1
          fi
          echo "file=${mrpacks[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate notes-file
        if: inputs['notes-file'] != ''
        env:
          NOTES_FILE: ${{ inputs['notes-file'] }}
        run: |
          case "$NOTES_FILE" in
            /*)
              echo "::error::notes-file must be a repo-relative path, got an absolute path: '$NOTES_FILE'"
              exit 1
              ;;
          esac
          workspace="$(realpath -e -- "$GITHUB_WORKSPACE")"
          if ! resolved="$(realpath -e -- "$NOTES_FILE" 2>/dev/null)"; then
            echo "::error::notes-file '$NOTES_FILE' does not exist"
            exit 1
          fi
          case "$resolved" in
            "$workspace"/*|"$workspace") : ;;
            *)
              echo "::error::notes-file '$NOTES_FILE' resolves outside the checkout"
              exit 1
              ;;
          esac
          [ -d "$resolved" ] && { echo "::error::notes-file '$NOTES_FILE' is a directory, not a file"; exit 1; }
          [ -s "$resolved" ] || { echo "::error::notes-file '$NOTES_FILE' is empty"; exit 1; }

      # Secrets can't be read directly in `if:`, so map into env and test
      # only for emptiness.
      - name: Check Modrinth configuration
        id: modrinth_check
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          if [ -n "$MODRINTH_TOKEN" ] && [ -n "$MODRINTH_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # Read-only reconcile probes: gather facts about what already exists
      # before deciding anything or mutating anything.
      #
      # The tag's own PEELED commit (not a GitHub Release's cached
      # target_commitish) is the authority for "does v<version> already
      # point somewhere" — a release object's metadata can exist
      # independently of (and, in principle, disagree with) the tag it
      # names, and a tag can exist with no Release object at all (e.g. one
      # pushed by hand). `^{commit}` peels an annotated tag to the commit it
      # points at; a lightweight tag resolves to the commit directly either
      # way.
      - name: Look up existing release tag
        if: inputs.authorized && !inputs.hold
        id: existing_tag
        env:
          VERSION: ${{ needs.normalize.outputs.version }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}^{commit}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse "refs/tags/v${VERSION}^{commit}")" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up existing GitHub Release object
        if: inputs.authorized && !inputs.hold
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.normalize.outputs.version }}
        run: |
          # Only a verified 404 means absent. Permission, rate-limit, and
          # transport errors must not select a potentially destructive create.
          response="$RUNNER_TEMP/github-release-response"
          code=0
          gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > "$response" || code=$?
          status="$(awk '/^HTTP\// {print $2; exit}' "$response")"
          if [ "$code" -eq 0 ] && [ "$status" = 200 ]; then
            body="$(sed '1,/^\r\{0,1\}$/d' "$response")"
            id="$(echo "$body" | jq -er '.id | select(type == "number")')"
            url="$(echo "$body" | jq -er '.html_url | select(type == "string" and length > 0)')"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "id=$id" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 404 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GitHub Release lookup failed (HTTP ${status:-unknown}, exit $code); refusing to assume the release is absent"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        if: inputs.authorized && !inputs.hold && steps.modrinth_check.outputs.configured == 'true'

      - name: Look up existing Modrinth version
        id: existing_modrinth
        if: inputs.authorized && !inputs.hold && steps.modrinth_check.outputs.configured == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          VERSION: ${{ needs.normalize.outputs.version }}
          RINTH_REF: ${{ inputs.rinth-ref }}
        run: |
          set +e
          out="$(bunx --bun "github:brooswit-minecraft/rinth#${RINTH_REF}" versions latest "$PROJECT_ID" --version-number "$VERSION" --json 2>&1)"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "id=$(echo "$out" | jq -r .id)" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 7 ]; then
            # NoVersionMatch (rinth ExitCode.NoVersionMatch) — no existing
            # version for this version-number, not an error.
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::rinth versions latest failed unexpectedly (exit $code): $out"
            exit 1
          fi

      - name: Decide publication state
        id: decide
        env:
          SHA: ${{ needs.normalize.outputs.sha }}
          AUTHORIZED: ${{ inputs.authorized }}
          HOLD: ${{ inputs.hold }}
          MODRINTH_REQUIRED: ${{ inputs.modrinth-required }}
          MODRINTH_CONFIGURED: ${{ steps.modrinth_check.outputs.configured }}
          TAG_EXISTS: ${{ steps.existing_tag.outputs.exists }}
          TAG_SHA: ${{ steps.existing_tag.outputs.sha }}
          RELEASE_EXISTS: ${{ steps.existing_release.outputs.exists }}
          RELEASE_ID: ${{ steps.existing_release.outputs.id }}
          RELEASE_URL: ${{ steps.existing_release.outputs.url }}
          MODRINTH_EXISTS: ${{ steps.existing_modrinth.outputs.exists }}
          MODRINTH_ID: ${{ steps.existing_modrinth.outputs.id }}
        run: |
          python3 - <<'PYEOF' > "$RUNNER_TEMP/facts.json"
          import json, os

          def as_bool(v):
              return str(v).strip().lower() == "true"

          facts = {
              "sha": os.environ["SHA"],
              "authorized": as_bool(os.environ["AUTHORIZED"]),
              "hold": as_bool(os.environ["HOLD"]),
              "modrinth_required": as_bool(os.environ["MODRINTH_REQUIRED"]),
              "modrinth_configured": as_bool(os.environ["MODRINTH_CONFIGURED"]),
              "existing_tag": (
                  {"sha": os.environ["TAG_SHA"]}
                  if as_bool(os.environ["TAG_EXISTS"])
                  else None
              ),
              "existing_release": (
                  {"id": os.environ["RELEASE_ID"], "url": os.environ["RELEASE_URL"]}
                  if as_bool(os.environ["RELEASE_EXISTS"])
                  else None
              ),
              "existing_modrinth_version": (
                  {"id": os.environ["MODRINTH_ID"]}
                  if as_bool(os.environ.get("MODRINTH_EXISTS", "false"))
                  else None
              ),
          }
          print(json.dumps(facts))
          PYEOF
          set +e
          out="$(python3 .schematic-mechanism/scripts/release_state.py decide --facts "$RUNNER_TEMP/facts.json")"
          set -e
          echo "$out" > "$RUNNER_TEMP/decision.json"
          state="$(echo "$out" | jq -r .state)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "release_action=$(echo "$out" | jq -r .release_action)" >> "$GITHUB_OUTPUT"
          echo "modrinth_action=$(echo "$out" | jq -r .modrinth_action)" >> "$GITHUB_OUTPUT"
          echo "release_id=$(echo "$out" | jq -r .release_id)" >> "$GITHUB_OUTPUT"
          echo "release_url=$(echo "$out" | jq -r .release_url)" >> "$GITHUB_OUTPUT"
          echo "modrinth_version_id=$(echo "$out" | jq -r .modrinth_version_id)" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_STEP_SUMMARY"
          if [ "$state" = "failed" ]; then
            echo "::error::$(echo "$out" | jq -r .error)"
            exit 1
          fi

      # Non-mutating short-circuit outcomes (build-only / held / skipped):
      # the job's final outputs are set here and no release/Modrinth step
      # runs at all.
      - name: Finalize non-mutating state
        id: shortcircuit
        if: contains(fromJSON('["build-only","held","skipped"]'), steps.decide.outputs.state)
        run: |
          echo "state=${{ steps.decide.outputs.state }}" >> "$GITHUB_OUTPUT"
          echo "release-id=${{ steps.decide.outputs.release_id }}" >> "$GITHUB_OUTPUT"
          echo "release-url=${{ steps.decide.outputs.release_url }}" >> "$GITHUB_OUTPUT"
          echo "modrinth-version-id=${{ steps.decide.outputs.modrinth_version_id }}" >> "$GITHUB_OUTPUT"

      - name: Write changelog to file
        if: steps.decide.outputs.state == 'publishing'
        id: changelog
        env:
          NOTES_FILE: ${{ inputs['notes-file'] }}
        run: |
          file="$RUNNER_TEMP/release-changelog.txt"
          if [ -n "$NOTES_FILE" ]; then
            cp -- "$NOTES_FILE" "$file"
          else
            printf '' > "$file"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # softprops/action-gh-release: when the tag already exists, GitHub
      # ignores target_commitish and attaches the release to the commit the
      # tag already points at — which `existing_tag`'s match against `sha`
      # above already guarantees is the requested commit. target_commitish
      # here only matters on first creation of the tag itself.
      - name: Create GitHub Release
        id: create_release
        if: steps.decide.outputs.state == 'publishing' && steps.decide.outputs.release_action == 'create'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.normalize.outputs.version }}
          name: ${{ steps.pack.outputs.name }}
          target_commitish: ${{ needs.normalize.outputs.sha }}
          generate_release_notes: ${{ inputs['notes-file'] == '' }}
          body_path: ${{ inputs['notes-file'] != '' && steps.changelog.outputs.file || '' }}
          files: build/*.mrpack

      # action-gh-release's own `id` output is the release's node id, not a
      # database id/URL pair we can feed straight into our outputs — look it
      # up the same way the pre-existing-release path does, so both paths
      # produce identically-shaped release-id/release-url outputs.
      - name: Resolve created release identity
        id: created_release
        if: steps.decide.outputs.state == 'publishing' && steps.decide.outputs.release_action == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.normalize.outputs.version }}
        run: |
          out="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json databaseId,url)"
          echo "id=$(echo "$out" | jq -r .databaseId)" >> "$GITHUB_OUTPUT"
          echo "url=$(echo "$out" | jq -r .url)" >> "$GITHUB_OUTPUT"

      # Record publication only after the GitHub Release identity is known.
      # This survives a later Modrinth failure and makes a retry actionable.
      - name: Record GitHub publication checkpoint
        id: checkpoint
        if: steps.decide.outputs.state == 'publishing'
        env:
          RELEASE_ID: ${{ steps.created_release.outputs.id || steps.decide.outputs.release_id }}
          RELEASE_URL: ${{ steps.created_release.outputs.url || steps.decide.outputs.release_url }}
          MODRINTH_ID: ${{ steps.decide.outputs.modrinth_version_id }}
        run: |
          echo "state=publishing" >> "$GITHUB_OUTPUT"
          echo "release-id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "release-url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "modrinth-version-id=$MODRINTH_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve Modrinth targets
        id: targets
        if: steps.decide.outputs.state == 'publishing' && steps.decide.outputs.modrinth_action == 'create'
        run: |
          echo "minecraft=$(sed -n 's/^minecraft = "\(.*\)"/\1/p' pack.toml)" >> "$GITHUB_OUTPUT"
          {
            echo "loaders<<TARGETS_EOF"
            sed -n -E 's/^(forge|fabric|neoforge|quilt) = ".*"/\1/p' pack.toml
            echo "TARGETS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        id: publish_modrinth
        if: steps.decide.outputs.state == 'publishing' && steps.decide.outputs.modrinth_action == 'create'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MRPACK_FILE: ${{ steps.mrpack.outputs.file }}
          VERSION: ${{ needs.normalize.outputs.version }}
          CHANGELOG_FILE: ${{ steps.changelog.outputs.file }}
          MINECRAFT: ${{ steps.targets.outputs.minecraft }}
          LOADERS: ${{ steps.targets.outputs.loaders }}
          CHANNEL: ${{ contains(needs.normalize.outputs.version, '-') && 'beta' || 'release' }}
          RINTH_REF: ${{ inputs.rinth-ref }}
        run: |
          loader_flags=()
          while IFS= read -r loader; do
            [ -n "$loader" ] && loader_flags+=(--loader "$loader")
          done <<< "$LOADERS"

          out="$(bunx --bun "github:brooswit-minecraft/rinth#${RINTH_REF}" publish "$PROJECT_ID" \
            --file "$MRPACK_FILE" \
            --version "$VERSION" \
            --changelog-file "$CHANGELOG_FILE" \
            --game-version "$MINECRAFT" \
            "${loader_flags[@]}" \
            --channel "$CHANNEL" \
            --json)"
          echo "id=$(echo "$out" | jq -r .id)" >> "$GITHUB_OUTPUT"

      # Only a successful publishing branch supersedes the checkpoint.
      # Earlier failures stay failed; failures after GitHub publication retain
      # publishing and the known release identity for reconciliation on retry.
      - name: Finalize publishing state
        id: finalize
        if: steps.decide.outputs.state == 'publishing'
        run: |
          release_id="${{ steps.decide.outputs.release_action == 'create' && steps.created_release.outputs.id || steps.decide.outputs.release_id }}"
          release_url="${{ steps.decide.outputs.release_action == 'create' && steps.created_release.outputs.url || steps.decide.outputs.release_url }}"
          modrinth_id="${{ steps.decide.outputs.modrinth_action == 'create' && steps.publish_modrinth.outputs.id || steps.decide.outputs.modrinth_version_id }}"
          echo "state=published" >> "$GITHUB_OUTPUT"
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
          echo "release-url=$release_url" >> "$GITHUB_OUTPUT"
          echo "modrinth-version-id=$modrinth_id" >> "$GITHUB_OUTPUT"

  # Always expose a contract state, including when normalization fails and the
  # release job is skipped. This does not turn a failed workflow green.
  outcome:
    name: Report release outcome
    if: ${{ always() }}
    needs: [normalize, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      state: ${{ needs.release.outputs.state || 'failed' }}
      sha: ${{ needs.normalize.outputs.sha }}
      version: ${{ needs.normalize.outputs.version }}
      artifact-name: ${{ needs.release.outputs.artifact-name }}
      release-id: ${{ needs.release.outputs.release-id }}
      release-url: ${{ needs.release.outputs.release-url }}
      modrinth-version-id: ${{ needs.release.outputs.modrinth-version-id }}
    steps:
      - name: Preserve upstream failure status
        env:
          NORMALIZE_RESULT: ${{ needs.normalize.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          [ "$NORMALIZE_RESULT" = success ] && [ "$RELEASE_RESULT" = success ]

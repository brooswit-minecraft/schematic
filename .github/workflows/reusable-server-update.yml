name: Reusable Server update

# Callable from a consumer's thin server-update.yml stub. After a release
# publishes a version to Modrinth, looks that version up and installs it on
# a Modrinth-hosted server. The alternative SFTP route stops the game over
# RCON, atomically uploads the exact GitHub Release, then refreshes Hosting's
# existing runtime through Rinth. Skips
# cleanly (and the run still succeeds) when MODRINTH_SERVER_ID /
# MODRINTH_TOKEN are not configured — see the "Check configuration" step
# below. Runs against the CALLER's checkout — actions/checkout below checks
# out whichever repo invoked this workflow, not this one.
#
# `github.event_name` / `github.event.release.*` here reflect the CALLER's
# original triggering event, not a synthetic "workflow_call" event — see the
# note in reusable-release.yml for how that was verified. That is also what
# makes the three-way branch below work: a stub chained via `workflow_run`
# forwards `event_name = "workflow_run"` and `github.event.workflow_run.*`
# from ITS OWN trigger, not a synthetic value from this reusable workflow.
#
# Three ways a caller can reach this workflow, and this file must keep all
# three working forever (see the stub migration note in README.md):
#   - release        the legacy direct trigger (`release: published`) races
#                     reusable-release.yml on the same event, still used by
#                     any consumer whose stub hasn't migrated to chaining.
#   - workflow_run    the new chained trigger: the stub fires after this
#                     repo's "Release" workflow run completes, so there is no
#                     race — see the stub in this repo's own server-update.yml.
#   - workflow_dispatch  the manual re-point path, unrelated to either
#                     trigger above.

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Version to look up on Modrinth, forwarded from the stub's
          workflow_dispatch input. Ignored on the release and workflow_run
          paths: on release this workflow reads github.event.release.tag_name
          directly; on workflow_run it reads
          github.event.workflow_run.head_branch (which, for a run triggered
          by a published release, is the release tag — see "Resolve version"
          below). Falls back to pack.toml only if none of those apply.
        required: false
        type: string

jobs:
  deploy-method:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment selector
        env:
          METHOD: ${{ vars.SERVER_DEPLOY_METHOD }}
        run: |
          case "${METHOD:-modrinth-api}" in
            modrinth-api|sftp) ;;
            *) echo '::error::SERVER_DEPLOY_METHOD must be modrinth-api or sftp'; exit 1 ;;
          esac

  server-update:
    needs: deploy-method
    if: vars.SERVER_DEPLOY_METHOD == '' || vars.SERVER_DEPLOY_METHOD == 'modrinth-api'
    name: Update server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # github.event.release.tag_name, github.event.workflow_run.head_branch,
      # and inputs.version are all attacker-influenced (a release tag, a
      # chained run's tag-named branch, or a dispatch input), so none of them
      # must ever be interpolated directly into the run: shell body — GitHub
      # substitutes them textually before the shell runs, which is a
      # script-injection vector. Pass them through env: instead.
      #
      # On workflow_run, head_branch is the tag that triggered the upstream
      # Release run — confirmed empirically (sickos run 33226276846, event
      # released as tag v0.1.0, reports headBranch "v0.1.0"). There is no
      # release payload on this path (github.event.release is unset), so
      # tag_name can't be read directly the way the release branch does.
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            version="${RELEASE_TAG#v}"
          elif [ "$EVENT_NAME" = "workflow_run" ] && [ "$WORKFLOW_RUN_EVENT" = "release" ]; then
            version="${WORKFLOW_RUN_HEAD_BRANCH#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' pack.toml)"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # Secrets cannot be read directly in an `if:` expression, so this step
      # reads them from env and writes a single boolean to $GITHUB_OUTPUT
      # instead. Never echo the values themselves. A missing
      # MODRINTH_PROJECT_ID alongside the other two IS configured is a
      # misconfiguration (it would otherwise fall through to an opaque
      # /v2/project//version 404 below), so it fails loudly rather than
      # skipping.
      - name: Check configuration
        id: config
        env:
          MODRINTH_SERVER_ID: ${{ vars.MODRINTH_SERVER_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          if [ -n "$MODRINTH_SERVER_ID" ] && [ -n "$MODRINTH_TOKEN" ]; then
            if [ -z "$MODRINTH_PROJECT_ID" ]; then
              echo "::error::MODRINTH_SERVER_ID and MODRINTH_TOKEN are set but MODRINTH_PROJECT_ID is not — set the MODRINTH_PROJECT_ID repo variable to the Modrinth project this server should follow."
              exit 1
            fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Modrinth server update
        if: steps.config.outputs.configured != 'true'
        run: echo "MODRINTH_SERVER_ID / MODRINTH_TOKEN not set — skipping Modrinth server update"

      - uses: oven-sh/setup-bun@v2
        if: steps.config.outputs.configured == 'true'

      # Looks up the just-published version on Modrinth by its version
      # number, via the rinth CLI (pinned #v0.9.1 — see the pin note on the
      # "Update Modrinth server" step below for why a tag, not a branch).
      # rinth's transport reads MODRINTH_TOKEN from the environment and
      # requires it unconditionally, so this lookup is authenticated because
      # a Modrinth project stays a DRAFT — invisible to unauthenticated
      # reads — until Modrinth moderation approves it, which every
      # consumer's first releases go through.
      # On the release path, release.yml and server-update.yml both fire on
      # the same `release: published` event with no ordering dependency, so
      # reusable-release.yml may still be building/publishing the .mrpack
      # when this step starts; `--wait 300 --wait-interval 15` bounds this to
      # up to ~5 minutes (20 attempts x 15s) before failing, matching the
      # legacy curl loop's budget exactly. That race is why a consumer's
      # stub should chain on workflow_run instead (see server-update.yml and
      # the README migration note) — once chained, this step no longer races
      # reusable-release.yml, since the stub only fires after the Release
      # workflow run has already completed. The wait still runs on that path
      # too, now purely as insurance against Modrinth publish-to-API-visibility
      # lag rather than as a race mitigation. Sizing was reviewed against a
      # real chained release (sickos run 33322343392: found on attempt 1/20,
      # ~13s after publish) and deliberately kept unchanged — an unused
      # attempt costs nothing on the happy path, and one data point doesn't
      # bound the tail of a third-party service we don't control. The
      # release path's budget can't shrink regardless: it must stay large as
      # long as any consumer (schematic-example today) is still on
      # `release: published` instead of chaining. On workflow_dispatch the
      # version is expected to already exist (a manual re-point), so
      # `--wait` is omitted entirely — rinth's default is exactly one
      # attempt, i.e. fail fast. Exhausting the budget without a match is a
      # real error worth failing loudly for, not a skip.
      #
      # rinth distinguishes a draft/unreadable project (exit 4,
      # project_unreadable) from "project readable, no matching version"
      # (exit 7 no_version_match, or exit 8 wait_exhausted once a --wait
      # budget runs out) the same way the old curl loop drew that
      # distinction by capturing the HTTP status instead of using `curl -f`.
      # Each exit code below is mapped to its own ::error:: line rather than
      # letting a raw exit code or rinth's own message be the only output.
      - name: Resolve published version id
        if: steps.config.outputs.configured == 'true'
        id: modrinth_version
        env:
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ] || [ "$EVENT_NAME" = "workflow_run" ]; then
            wait_args=(--wait 300 --wait-interval 15)
          else
            wait_args=()
          fi

          set +e
          stdout="$(bunx --bun github:brooswit-minecraft/rinth#v0.9.1 versions latest "$PROJECT_ID" --version-number "$VERSION" "${wait_args[@]}" --json 2>/tmp/rinth_stderr.json)"
          status=$?
          set -e
          stderr="$(cat /tmp/rinth_stderr.json)"

          if [ "$status" -eq 0 ]; then
            version_id="$(printf '%s' "$stdout" | jq -r '.id')"
            if [ -z "$version_id" ] || [ "$version_id" = "null" ]; then
              echo "::error::rinth versions latest exited 0 but produced no usable version id (got: ${stdout})."
              exit 1
            fi
            echo "id=$version_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [ -n "$stderr" ] && echo "$stderr"

          case "$status" in
            3)
              echo "::error::MODRINTH_TOKEN is missing or was rejected by Modrinth."
              ;;
            4)
              echo "::error::Modrinth project ${PROJECT_ID} could not be read — it may still be a draft awaiting Modrinth moderation approval, the project id may be wrong, or MODRINTH_TOKEN may lack access to it."
              ;;
            8)
              echo "::error::No Modrinth version found for project ${PROJECT_ID} with version_number ${VERSION} after the ~300s (20-attempt) budget — has this release been published to Modrinth yet?"
              ;;
            7)
              if [ "$EVENT_NAME" = "release" ] || [ "$EVENT_NAME" = "workflow_run" ]; then
                echo "::error::No Modrinth version found for project ${PROJECT_ID} with version_number ${VERSION} after the ~300s (20-attempt) budget — has this release been published to Modrinth yet?"
              else
                echo "::error::No Modrinth version found for project ${PROJECT_ID} with version_number ${VERSION} — has this release been published to Modrinth yet?"
              fi
              ;;
            *)
              echo "::error::rinth versions latest failed (exit ${status}): ${stderr}"
              ;;
          esac

          exit "$status"

      # This path keeps the hosted server linked to a catalog-visible Modrinth
      # project. Draft/processing projects must use the explicit SFTP route;
      # Hosting's local-mrpack credential cannot be obtained with a PAT.
      - name: Update Modrinth server
        if: steps.config.outputs.configured == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          SERVER_ID: ${{ vars.MODRINTH_SERVER_ID }}
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          VERSION_ID: ${{ steps.modrinth_version.outputs.id }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bunx --bun github:brooswit-minecraft/rinth#670d04b servers upstream \
            "$SERVER_ID" --project "$PROJECT_ID" --version "$VERSION_ID" --restart --json

  server-upload:
    name: Stop, upload, and refresh server
    needs: deploy-method
    if: vars.SERVER_DEPLOY_METHOD == 'sftp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: schematic-sftp-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # A reusable workflow checks out its caller, which may not have these
      # scripts. Fetch the implementation from the same upstream release line.
      - uses: actions/checkout@v4
        with:
          repository: brooswit-minecraft/schematic
          ref: v1
          path: .schematic-tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
      - name: Install SFTP client
        run: python -m pip install 'paramiko==4.0.0'
      - name: Validate Hosting refresh configuration
        env:
          MODRINTH_SERVER_ID: ${{ vars.MODRINTH_SERVER_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_SERVER_ID" ] || [ -z "$MODRINTH_TOKEN" ]; then
            echo '::error::The sftp deployment route requires MODRINTH_SERVER_ID and MODRINTH_TOKEN.'
            exit 1
          fi
      - name: Download exact release pack
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "$EVENT_NAME" in
            release) tag="$RELEASE_TAG" ;;
            workflow_run)
              if [ "$RUN_EVENT" = release ]; then
                tag="$RUN_TAG"
              else
                version="$(python -c 'import tomllib; print(tomllib.load(open("pack.toml", "rb"))["version"])')"
                tag="v${version#v}"
              fi
              ;;
            *)
              version="${INPUT_VERSION:-$(python -c 'import tomllib; print(tomllib.load(open("pack.toml", "rb"))["version"])')}"
              tag="v${version#v}"
              ;;
          esac
          if [[ ! "$tag" =~ ^v?[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo '::error::Invalid release tag'; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/server-release"
          attempts=1
          if [ "$EVENT_NAME" = release ] || [ "$EVENT_NAME" = workflow_run ]; then attempts=21; fi
          for ((i=1; i<=attempts; i++)); do
            # Fail API/auth errors immediately; only absent release assets wait.
            metadata="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets)"
            count="$(jq '[.assets[] | select(.name | endswith(".mrpack"))] | length' <<< "$metadata")"
            if [ "$count" -gt 1 ]; then echo '::error::Release has multiple mrpack assets'; exit 1; fi
            if [ "$count" -eq 1 ]; then break; fi
            if [ "$i" -eq "$attempts" ]; then echo '::error::Release mrpack asset not available'; exit 1; fi
            sleep 15
          done
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.mrpack' --dir "$RUNNER_TEMP/server-release"
          mapfile -d '' packs < <(find "$RUNNER_TEMP/server-release" -maxdepth 1 -type f -name '*.mrpack' -print0)
          if [ "${#packs[@]}" -ne 1 ]; then echo '::error::Expected exactly one release pack'; exit 1; fi
          python .schematic-tools/scripts/server_deploy.py materialize \
            --archive "${packs[0]}" --version "${tag#v}" --output "$RUNNER_TEMP/server-files"
      - name: Stop server and atomically upload verified files
        env:
          SERVER_RCON_HOST: ${{ vars.SERVER_RCON_HOST }}
          SERVER_RCON_PORT: ${{ vars.SERVER_RCON_PORT }}
          SERVER_RCON_SHUTDOWN_TIMEOUT: ${{ vars.SERVER_RCON_SHUTDOWN_TIMEOUT }}
          SERVER_RCON_PASSWORD: ${{ secrets.SERVER_RCON_PASSWORD }}
          SERVER_SFTP_HOST: ${{ vars.SERVER_SFTP_HOST }}
          SERVER_SFTP_PORT: ${{ vars.SERVER_SFTP_PORT }}
          SERVER_SFTP_PATH: ${{ vars.SERVER_SFTP_PATH }}
          SERVER_SFTP_USERNAME: ${{ secrets.SERVER_SFTP_USERNAME }}
          SERVER_SFTP_PASSWORD: ${{ secrets.SERVER_SFTP_PASSWORD }}
          SERVER_SFTP_PRIVATE_KEY: ${{ secrets.SERVER_SFTP_PRIVATE_KEY }}
          SERVER_SFTP_KNOWN_HOSTS: ${{ secrets.SERVER_SFTP_KNOWN_HOSTS }}
        run: python .schematic-tools/scripts/server_deploy.py deploy --output "$RUNNER_TEMP/server-files"
      - name: Start and refresh Modrinth Hosting runtime
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          SERVER_ID: ${{ vars.MODRINTH_SERVER_ID }}
        run: bunx --bun github:brooswit-minecraft/rinth#5a1b3e4 servers refresh-runtime "$SERVER_ID" --json
      - name: Verify Minecraft is ready
        env:
          SERVER_RCON_HOST: ${{ vars.SERVER_RCON_HOST }}
          SERVER_RCON_PORT: ${{ vars.SERVER_RCON_PORT }}
          SERVER_RCON_SHUTDOWN_TIMEOUT: ${{ vars.SERVER_RCON_SHUTDOWN_TIMEOUT }}
          SERVER_RCON_PASSWORD: ${{ secrets.SERVER_RCON_PASSWORD }}
        run: python .schematic-tools/scripts/server_deploy.py wait-ready
      - name: Report live deployment
        run: |
          echo 'Exact release files uploaded and the Modrinth Hosting runtime refreshed.'
          echo 'SFTP deployment complete: RCON shutdown, atomic upload, and Hosting runtime refresh succeeded.' >> "$GITHUB_STEP_SUMMARY"
